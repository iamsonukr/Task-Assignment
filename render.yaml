# Render blueprint for the API. Frontend deploys to Vercel (see README).
services:
  - type: web
    name: taskflow-api
    runtime: node
    rootDir: backend
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: MONGODB_URI, sync: false }      # MongoDB Atlas connection string
      - { key: JWT_SECRET, generateValue: true }
      - { key: FRONTEND_ORIGINS, sync: false } # e.g. https://your-app.vercel.app
